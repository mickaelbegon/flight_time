name: flight_time
description: "Compute the flight time of a jump using the video camera"
publish_to: 'none' 

version: 1.0.2+5

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter
  camerawesome: ^2.1.0
  # Experimental Android high-speed capture evaluation. The fork adds exact
  # Camera2 capability discovery and post-capture timestamp diagnostics.
  nitro_camera:
    git:
      url: https://github.com/mickaelbegon/nitro_camera.git
      ref: '4ece5e3'
  video_player: ^2.9.2
  cupertino_icons: ^1.0.8
  sembast: ^3.7.5
  path: ^1.9.0
  path_provider: ^2.1.4
  intl: ^0.19.0
  flutter_video_info: ^1.3.2
  shared_preferences: ^2.3.3
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  path_provider_linux: ^2.2.1
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.2

flutter:
  uses-material-design: true
  assets:
    - assets/icons/patinage_quebec_logo.png
    - assets/icons/s2m_logo.png
    - assets/fonts/
